<ion-header>
  <ion-toolbar translucent>
    <ion-buttons slot="start" color="none">
            <ion-buttons slot="start" color="none">
                <ion-back-button color="none" defaultHref="home"></ion-back-button>
            </ion-buttons>
        </ion-buttons>
        <ion-title>Upload Attendance </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg bgWhite" color="light">
 <div id="container" >
<div class="dropdown">
  <select [(ngModel)]="subject" class="native" (change)="optionSelected()">
    <option value="" selected>Select an option</option>
      <option value="In Office">In Office</option>
      <option value="In field for office work" *ngIf="department=='Admin'">In field for office work</option>
      <option value="Reached Customer"  *ngIf="department=='Sales'">Reached Customer</option>
      <option value="Going to Customer" *ngIf="department=='Sales'">Going to Customer</option>
      <option value="Half Day">Half Day</option>
      <option value="Absent">Absent</option>
      <option value="Present" *ngIf="department=='Admin'">Present</option>
      <option value="Absent Without Information" *ngIf="department=='Admin'">Absent Without Information</option>
      <option value="Approve Leave" *ngIf="department=='Admin'">Approve Leave</option>
  </select>
  <h3> Please enter comments. (Optional)</h3>
    <ion-textarea class="nativearea" rows="4"  [(ngModel)]="comment"></ion-textarea>
   </div>

  <div *ngIf="pageError" class="page-error" (click)="clearPageMessage()">
    <strong>Error</strong>
    <p>{{ pageError }}</p>
    <span class="page-msg-dismiss">Tap to dismiss</span>
  </div>
  <div *ngIf="pageSuccess && !pageError" class="page-success" (click)="clearPageMessage()">
    <strong>Success</strong>
    <p>{{ pageSuccess }}</p>
    <span class="page-msg-dismiss">Tap to dismiss</span>
  </div>

 	<div class="attupload">
    <div *ngIf="hasPreview" class="preview-wrap">
      <!-- src is set in TypeScript via ViewChild (Cordova WebView cannot paint data:/blob: URLs) -->
      <img #previewImg class="preview-image" alt="Selected attendance photo" (click)="openePicChooser()">
      <p class="preview-label">Selected photo — tap Submit below</p>
    </div>
 		<img *ngIf="!hasPreview" (click)="openePicChooser()" class="imgwidth" src="assets/uploadattandence.png" alt="Upload attendance">
     <h4 (click)="openePicChooser()">{{ hasPreview ? 'Change photo' : 'Click to take / choose photo' }}</h4>
     <ion-button *ngIf="hasPreview" expand="block" class="submit-btn" (click)="submitAttendance()">
       Submit Attendance
     </ion-button>
 	</div>
 	
 </div>
</ion-content>
