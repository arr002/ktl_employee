<ion-header>
  <ion-toolbar translucent>
    <ion-buttons slot="start" color="none">
      <ion-buttons slot="start" color="none">
        <ion-back-button color="none" defaultHref="home"></ion-back-button>
      </ion-buttons>
    </ion-buttons>
    <ion-title style="font-size: large;">Banner Upload</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="bgWhite" style="height: 70%; padding-bottom: 22px !important;">

  <ion-item style="margin-top: 20px !important;">
    <ion-label>Customer Type</ion-label>
    <ion-select style="width:100%;" placeholder="Select Option" [(ngModel)]="customer_type" class="native">
      <ion-select-option value="D">New Dealer</ion-select-option>
      <ion-select-option value="M">Manufacturer</ion-select-option>
      <ion-select-option value="R">Retailer</ion-select-option>
      <ion-select-option value="T">Tailor</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <ion-label color="secondary" style="padding-top: 11px !important;">Shop Name</ion-label>
        </ion-col>
        <ion-col size="8">
          <ion-input class="inputclass" [(ngModel)]="shop_name" style="text-indent: 11px !important;"></ion-input>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="4">
          <ion-label color="secondary" style="padding-top: 11px !important;">Shop Mobile</ion-label>
        </ion-col>
        <ion-col size="8">
          <ion-input type="tel" inputmode="numeric" class="inputclass" [(ngModel)]="shop_mobile"
            style="text-indent: 11px !important;" maxlength="10" (keydown)="onKeyDown($event)" (keyup)="onKeyUp($event)"
            (ionInput)="validatePhone($event)" pattern="^[0-9]{10}$"></ion-input>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-item>

  <div class="attupload">
    <img (click)="openePicChooser()" class="imgwidth" src="assets/uploadattandence.png" style="width: 150px;">
    <h4 (click)="openePicChooser()" style="color:#4E42B0; font-size:14px; border:1px solid #4E42B0; padding:10px;border-radius:20px; background:#F3FDFD;">Click to upload shop image</h4>
    <p *ngIf="imageFile" style="color: green; font-weight: bold; margin-top: 10px;">Image Selected Successfully</p>
  </div>

</ion-content>

<ion-footer>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button color="danger" expand="full" (click)="uploadData()">Upload Data</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-footer>
