<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="dsdrtrview"></ion-back-button>
    </ion-buttons>
    <ion-title>Branch Managers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light"  class="bgWhite">

  <ion-list>
    <ion-item *ngFor="let managers of branchManagerList">
      <ion-label (click)="navigateTo(managers.id)">{{managers.name}}</ion-label>
    </ion-item>
  </ion-list>


</ion-content>
