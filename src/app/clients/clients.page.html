<ion-header>
  <ion-toolbar>
    <ion-title>Select Client</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light"  class="bgWhite">
<ion-radio-group name="radio-group" [(ngModel)]="selectedRadioGroup" (ionChange)="radioGroupChange($event)">
<ion-item *ngFor="let prod of customers">
 	
      <ion-radio value="{{prod.customer_name}}"></ion-radio>
      <ion-label class="ion-text-wrap txtname">{{prod.customer_name}}</ion-label>
 </ion-item>  
</ion-radio-group>
</ion-content>
