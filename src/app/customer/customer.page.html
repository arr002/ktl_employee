<ion-header>
  <ion-toolbar>
    <ion-title>Customers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
<ion-toolbar>
    <ion-searchbar animated="true" mode="ios" [(ngModel)]="searchTerm" (ionInput)="setFilterCustomer()" ></ion-searchbar>
</ion-toolbar>

<ion-list>
   <ion-item class="ion-border" *ngFor="let item of itemss"  (click)="selectItem(item)" tappable>
       
        <ion-label > {{ item?.client_name }}</ion-label>
    </ion-item>
</ion-list>
</ion-content>
