<ion-header class="picker-header">
  <ion-toolbar>
    <ion-title>{{ title || 'Customers' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button class="close-btn" fill="clear" (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="picker-page">
  <div class="picker-wrap">
    <ion-searchbar
      class="picker-search"
      mode="ios"
      animated="true"
      placeholder="Search customer..."
      [(ngModel)]="searchTerm"
      (ionInput)="setFilterCustomer()">
    </ion-searchbar>

    <p class="result-count" *ngIf="itemss?.length">{{ itemss.length }} customer(s)</p>

    <button
      type="button"
      class="picker-item"
      *ngFor="let item of itemss"
      (click)="selectItem(item)">
      <span class="avatar">{{ (item?.client_name || '?').charAt(0) }}</span>
      <span class="item-name">{{ item?.client_name }}</span>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>

    <div class="empty-state" *ngIf="!itemss?.length">
      <ion-icon name="people-outline"></ion-icon>
      <p>No customers found</p>
    </div>
  </div>
</ion-content>
