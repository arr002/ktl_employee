<ion-menu contentId="home-main" menuId="home-menu" side="start" class="home-side-menu">
  <ion-content class="side-menu-content">
    <div class="side-profile">
      <ion-avatar class="side-avatar">
        <img [src]="image" alt="Profile">
      </ion-avatar>
      <h2 class="side-name">{{name}}</h2>
      <p class="side-role" *ngIf="designation || department">{{designation}}<span *ngIf="designation && department"> · </span>{{department}}</p>
      <p class="side-branch" *ngIf="branchname">{{branchname}}</p>
    </div>

    <div class="side-actions">
      <button type="button" class="side-item" (click)="openMyProfile()">
        <ion-icon name="person-outline"></ion-icon>
        <span>My Profile</span>
      </button>

      <button type="button" class="side-item" (click)="changeProfilePhoto()">
        <ion-icon name="camera-outline"></ion-icon>
        <span>Change Photo</span>
      </button>

      <button type="button" class="side-item side-logout" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Logout</span>
      </button>
    </div>
  </ion-content>
</ion-menu>

<div class="ion-page" id="home-main">
  <ion-content [fullscreen]="true" class="home-page">
    <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
      <ion-refresher-content pulling-text="Pull to refresh" refreshing-spinner="crescent"></ion-refresher-content>
    </ion-refresher>

    <div class="home-header">
      <div class="header-glow" aria-hidden="true"></div>
      <button type="button" class="menu-toggle" (click)="openMenu()" aria-label="Open menu">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
      <ion-avatar class="profile-avatar" (click)="takePicture()">
        <img [src]="image" alt="Profile">
      </ion-avatar>
      <h1 class="profile-name">{{name}}</h1>
      <p class="profile-caption">Tap photo to update</p>
    </div>

    <div class="menu-wrap">
      <button type="button" class="menu-retry" *ngIf="!homescreendata || homescreendata.length === 0" (click)="reloadHome()">
        <ion-icon name="refresh-outline"></ion-icon>
        <span>Menu could not load. Tap to retry.</span>
      </button>

      <div class="menu-section" *ngFor="let group of groupedmenu">
        <h2 class="section-title">{{group.title}}</h2>
        <div class="section-panel">
          <div class="menu-grid">
            <button
              type="button"
              class="menu-tile"
              *ngFor="let homedata of group.items"
              (click)="navigateRoute(homedata.id, homedata.route)">
              <span class="menu-icon">
                <img [src]="'assets/' + homedata.iconname" [alt]="homedata.itemname">
              </span>
              <span class="menu-label">{{homedata.itemname}}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </ion-content>
</div>
