<ion-header>
  <ion-toolbar translucent>
    <ion-buttons slot="start" color="none">
            <ion-buttons slot="start" color="none">
                <ion-back-button color="none" defaultHref="home"></ion-back-button>
            </ion-buttons>
        </ion-buttons>
        <ion-title>My Attendance</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg bgWhite" color="light">
<div class="maindiv">

    <ion-row>
 <ion-col size="4" (click)="cal(-1)">
<ion-button shape="round" fill="outline" color="primary">Previous</ion-button>
</ion-col>

  <ion-col size="4" (click)="cal(0)">
<ion-button shape="round" fill="outline" color="primary">Current</ion-button>
</ion-col>
<ion-col size="4" (click)="cal(1)">
<ion-button shape="round" fill="outline" color="primary">Next</ion-button>
</ion-col>
</ion-row>
<h4 style="padding-left: 10px;">Attendance Month: - {{month}}</h4>

 <ul class="gridcontainer" *ngFor="let clients of clientslist">

 	 <div class="griditem"> {{clients.day}} <span class="spancol">{{clients.attendance}}</span> 
 	 </div>

  </ul>

</div>



</ion-content>
