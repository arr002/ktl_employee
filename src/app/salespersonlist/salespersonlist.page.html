<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <div *ngIf="disable==true">

        <ion-icon style="font-size: 25px;" name="arrow-back-outline" [routerLink]="['/home']"></ion-icon>

      </div>
      <div *ngIf="disable!=true">

        <ion-back-button defaultHref="branchmanagers" *ngIf="disable!=true"></ion-back-button>
      </div>
    </ion-buttons>

    <ion-title>Sales Person List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light"  class="bgWhite">

  <ion-list>
    <ion-item *ngFor="let salesman of salesPersonList">
      <ion-label (click)="navigateTo(salesman.id)">{{salesman.name}}</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
